function Chart({rs}){
  const [rng,setRng]=useState(24);const [sel,setSel]=useState(null);

  const y=v=>t0+(y1-v)/(y1-y0)*(Hh-t0-b),x=t=>l+(t-start)/(now-start)*(W-l-rt);
  const pts=d.map(r=>`${x(r.t)},${y(r.temp)}`).join(' ');
  const s=d.find(r=>r.id===sel);
  return <div className="rounded-2xl bg-white dark:bg-slate-900 shadow-sm border border-slate-100 dark:border-slate-800 p-4">
    <div className="flex items-center justify-between mb-3"><h2 className="font-bold">مخطط الحرارة</h2>
      <div className="flex bg-slate-100 dark:bg-slate-800 rounded-xl p-1 text-sm">{[[24,'٢٤ ساعة'],[168,'٧ أيام']].map(([v,n])=><button key={v} onClick={()=>{setRng(v);setSel(null)}} className={`px-3 py-1 rounded-lg transition ${rng===v?'bg-white dark:bg-slate-700 shadow-sm font-bold':'text-slate-500'}`}>{n}</button>)}</div></div>
    <div dir="ltr"><svg viewBox={`0 0 ${W} ${Hh}`} className="w-full">
      <rect x={l} y={y(37.5)} width={W-l-rt} height={y(36)-y(37.5)} fill="#10b981" opacity=".15"/>
      <rect x={l} y={y(38.5)} width={W-l-rt} height={y(37.5)-y(38.5)} fill="#f59e0b" opacity=".15"/>
      <rect x={l} y={y(41)} width={W-l-rt} height={y(38.5)-y(41)} fill="#f43f5e" opacity=".15"/>
      {[36,37,38,39,40,41].map(v=><g key={v}><text x={l-4} y={y(v)+3} textAnchor="end" fontSize="9" className="fill-slate-400">{v}</text></g>)}
      {[0,.5,1].map(f=><text key={f} x={l+f*(W-l-rt)} y={Hh-6} textAnchor={f===0?'start':f===1?'end':'middle'} fontSize="9" className="fill-slate-400">{tm(start+f*(now-start))}</text>)}

      {d.map(r=><g key={r.id} onClick={()=>setSel(r.id)} className="cursor-pointer">
        {r.med&&<circle cx={x(r.t)} cy={y(r.temp)} r="9" fill="none" stroke="#8b5cf6" strokeWidth="2" strokeDasharray="3 2"/>}
        <circle cx={x(r.t)} cy={y(r.temp)} r={sel===r.id?7:5} fill={ST(r.temp).hex} stroke="white" strokeWidth="2"/></g>)}
    </svg></div>
    <div className="min-h-[52px] mt-2 text-sm">{s?<div className="pop flex items-center gap-2 flex-wrap rounded-xl bg-slate-50 dark:bg-slate-800 p-3"><b className="text-lg">{fa(s.temp,1)}°</b><span className={`px-2 py-0.5 rounded-full text-xs ${ST(s.temp).b}`}>{ST(s.temp).n}</span><span className="text-slate-500">{dy(s.t)} · {tm(s.t)}</span>{s.med&&<span className="px-2 py-0.5 rounded-full text-xs bg-violet-100 text-violet-700 dark:bg-violet-500/20 dark:text-violet-300">💊 {s.med.type} {fa(s.med.dose)} {s.med.unit}</span>}</div>:<p className="text-slate-400 text-center pt-3">اضغط على أي نقطة لعرض التفاصيل · الدائرة المنقطة = جرعة دواء</p>}</div>
  </div>;
}

    if(edit){setV(edit.temp);setSite(edit.site);setSy(edit.symptoms);setMed(!!edit.med);if(edit.med){setMt(edit.med.type);setDose(edit.med.dose);setDu(edit.med.unit);setMtime(hm(edit.t))}else setMtime(hm(Date.now()))}

      <div className="flex items-center justify-between mt-4 rounded-2xl bg-slate-50 dark:bg-slate-800 p-3"><span className="font-bold text-sm">تم إعطاء خافض حرارة؟</span>

function App(){

        <div className="flex gap-2"><button onClick={()=>setRep(true)} aria-label="تقرير" className={`${card} p-2.5`}><I n="file"/></button><button onClick={()=>setDark(!dark)} aria-label="الوضع" className={`${card} p-2.5`}><I n={dark?'sun':'moon'}/></button></div>
      </div>
      <div className="flex gap-2 mt-3 overflow-x-auto pb-1">{kids.map(c=><button key={c.id} onClick={()=>setKid(c.id)} className={`shrink-0 flex items-center gap-2 pl-4 pr-1.5 py-1.5 rounded-full border transition ${kid===c.id?'bg-teal-500 border-teal-500 text-white shadow-sm':'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700'}`}><span className={`w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold ${kid===c.id?'bg-white/25':'bg-teal-100 text-teal-700'}`}>{c.name[0]}</span><span className="text-sm font-medium">{c.name} ({c.age})</span></button>)}
        <button onClick={()=>{setEk(null);setNn('');setNa('');setAddK(true)}} className="shrink-0 px-4 py-2 rounded-full border border-dashed border-slate-300 dark:border-slate-600 text-sm text-slate-500">إضافة طفل +</button></div>
      <div className="flex gap-2 mt-2 text-xs"><button onClick={()=>{setEk(k.id);setNn(k.name);setNa(k.age==='—'?'':k.age);setAddK(true)}} className="flex items-center gap-1 px-3 py-1.5 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700"><I n="pencil" c="w-3.5 h-3.5"/>تعديل ملف {k.name}</button><button disabled={kids.length<2} onClick={()=>setDelK(true)} className="flex items-center gap-1 px-3 py-1.5 rounded-full bg-white dark:bg-slate-900 border border-rose-200 dark:border-rose-500/30 text-rose-600 dark:text-rose-300 disabled:opacity-40"><I n="trash" c="w-3.5 h-3.5"/>حذف الملف</button></div>
    </header>

    <main className="space-y-4 mt-2">
      {last?<section className={`${card} overflow-hidden pop`}>
        <div className={`bg-gradient-to-l ${s.g} text-white p-5`}>
          <p className="text-sm opacity-90">الحالة الحالية · {k.name}</p>
          <div className="flex items-end justify-between mt-1"><div className="text-6xl font-extrabold" dir="ltr">{fa(last.temp,1)}°</div>
            <div className="text-left"><span className="inline-block bg-white/25 rounded-full px-3 py-1 text-sm font-bold">{s.n}</span><p className="text-sm mt-2 flex items-center gap-1 justify-end"><I n="clock" c="w-4 h-4"/>{ago(now-last.t)}</p></div></div></div>
        <div className="p-4">
          <div className="flex items-center gap-2 mb-2"><span className="w-8 h-8 rounded-xl bg-violet-100 dark:bg-violet-500/20 text-violet-600 dark:text-violet-300 flex items-center justify-center"><I n="pill" c="w-4 h-4"/></span><span className="font-bold text-sm">مؤقت الجرعة القادمة</span></div>
          {lastMed?(rem>0?<><p className="text-sm">الجرعة القادمة من {lastMed.med.type} بعد <b>{dur(rem)}</b></p><div className="h-2 rounded-full bg-slate-100 dark:bg-slate-800 mt-2 overflow-hidden"><div className="h-full bg-violet-500 transition-all" style={{width:`${Math.min(100,(1-rem/total)*100)}%`}}/></div></>:<p className="text-sm text-emerald-600 dark:text-emerald-400 font-bold">يمكن إعطاء الجرعة التالية الآن (حسب توجيه الطبيب)</p>):<p className="text-sm text-slate-500">لم يتم تسجيل أي خافض حرارة بعد.</p>}
        </div></section>:<div className={`${card} p-8 text-center text-slate-400`}>لا توجد قراءات بعد، اضغط + لإضافة أول قراءة.</div>}

      {flag&&<section className="pop rounded-2xl border border-rose-200 dark:border-rose-500/30 bg-rose-50 dark:bg-rose-500/10 p-4 flex gap-3"><span className="text-rose-500 shrink-0"><I n="alert" c="w-6 h-6"/></span><div><p className="font-extrabold text-rose-700 dark:text-rose-300">تنبيه هام</p><p className="text-sm text-rose-700/90 dark:text-rose-200 mt-0.5">{last.temp>=39?'درجة الحرارة وصلت ٣٩° أو أكثر. ':''}{feverDays?'الحمى مستمرة لأكثر من ٣ أيام. ':''}يُنصح بمراجعة الطبيب.</p><button onClick={()=>setEr(true)} className="mt-2 text-sm font-bold underline text-rose-700 dark:text-rose-300">متى تذهب للطوارئ؟</button></div></section>}

      <Chart key={kid} rs={k.r}/>

      <section>
        <h2 className="font-bold mb-2">سجل النوبات</h2>
        <div className="space-y-4">{groups.map(g=><div key={g.d}><p className="text-xs font-bold text-slate-400 mb-2">{g.d}</p><div className="space-y-2">{g.items.map(r=>{const c=ST(r.temp);return <article key={r.id} className={`${card} p-3 pop`}>
          <div className="flex items-center gap-3"><span className="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-xl">{siteOf(r.site).e}</span>
            <div className="flex-1"><div className="flex items-center gap-2"><b className="text-lg" style={{color:c.hex}}>{fa(r.temp,1)}°</b><span className={`px-2 py-0.5 rounded-full text-xs ${c.b}`}>{c.n}</span></div><p className="text-xs text-slate-400">{tm(r.t)} · {siteOf(r.site).n}</p></div>
            <button onClick={()=>{setEdit(r);setSheet(true)}} aria-label="تعديل" className="p-2 text-slate-400 hover:text-teal-500"><I n="pencil" c="w-4 h-4"/></button>
            <button onClick={()=>upd(a=>a.filter(x=>x.id!==r.id))} aria-label="حذف" className="p-2 text-slate-400 hover:text-rose-500"><I n="trash" c="w-4 h-4"/></button></div>
          {(r.symptoms.length>0||r.med)&&<div className="flex flex-wrap gap-1.5 mt-2">{r.symptoms.map(x=><span key={x} className="px-2 py-0.5 rounded-full text-xs bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">{x}</span>)}{r.med&&<span className="px-2 py-0.5 rounded-full text-xs bg-violet-100 text-violet-700 dark:bg-violet-500/20 dark:text-violet-300">💊 {r.med.type} {fa(r.med.dose)} {r.med.unit}</span>}</div>}
        </article>})}</div></div>)}</div>
      </section>
    </main>

    <button onClick={()=>{setEdit(null);setSheet(true)}} className="fixed z-30 left-5 flex items-center gap-2 px-5 py-3.5 rounded-full bg-gradient-to-l from-teal-500 to-emerald-500 text-white font-extrabold shadow-lg active:scale-95 transition" style={{bottom:'calc(1.25rem + env(safe-area-inset-bottom,0px))'}}><I n="plus"/>إضافة قراءة</button>
    </div>

    <Sheet open={sheet} onClose={()=>setSheet(false)} onSave={save} edit={edit}/>

    <Modal open={rep} onClose={()=>setRep(false)} title={`تقرير الطبيب · ${k.name}`}>
      <p className="text-xs text-slate-400 mb-3">آخر ٤٨ ساعة · {dy(now)}</p>
      <div className="grid grid-cols-2 gap-2">{[['أعلى درجة',r48.length?fa(peak,1)+'°':'—'],['نطاق الحرارة',r48.length?`${fa(low,1)} – ${fa(peak,1)}`:'—'],['عدد الجرعات',fa(doses)],['عدد القراءات',fa(r48.length)]].map(([a,b])=><div key={a} className="rounded-2xl bg-slate-50 dark:bg-slate-800 p-3"><p className="text-xs text-slate-500">{a}</p><p className="text-xl font-extrabold mt-1">{b}</p></div>)}</div>
      <p className="font-bold mt-4 mb-2 text-sm">الأعراض المسجلة</p>
      <div className="flex flex-wrap gap-2">{Object.keys(sc).length?Object.entries(sc).map(([a,n])=><span key={a} className="px-3 py-1 rounded-full text-sm bg-teal-50 dark:bg-teal-500/15 text-teal-700 dark:text-teal-300">{a} ({fa(n)})</span>):<span className="text-sm text-slate-400">لا يوجد</span>}</div>
      <p className="font-bold mt-4 mb-2 text-sm">الأدوية المعطاة</p>
      <ul className="text-sm space-y-1">{r48.filter(r=>r.med).map(r=><li key={r.id}>• {r.med.type} {fa(r.med.dose)} {r.med.unit} — {tm(r.t)}</li>)}{doses===0&&<li className="text-slate-400">لا يوجد</li>}</ul>
      <button onClick={()=>window.print()} className="noprint mt-5 w-full py-3 rounded-2xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold flex items-center justify-center gap-2"><I n="file"/>طباعة / حفظ PDF</button>
    </Modal>

    <Modal open={er} onClose={()=>setEr(false)} title="متى تذهب للطوارئ؟">
      <ul className="space-y-2 text-sm">{['رضيع أقل من ٣ أشهر وحرارته ٣٨° أو أكثر','حرارة أعلى من ٤٠° أو لا تنخفض بعد الدواء','تشنجات أو إغماء','صعوبة في التنفس أو ازرقاق الشفاه','رفض الشرب أو علامات جفاف (قلة التبول)','طفح جلدي لا يختفي بالضغط، أو تيبّس الرقبة','خمول شديد أو صعوبة في الاستيقاظ','استمرار الحمى أكثر من ٣ أيام'].map(x=><li key={x} className="flex gap-2"><span className="text-rose-500"><I n="alert" c="w-4 h-4"/></span>{x}</li>)}</ul>
      <p className="text-xs text-slate-400 mt-4">هذه معلومات عامة وليست بديلاً عن استشارة الطبيب.</p>
    </Modal>

    <Modal open={delK} onClose={()=>setDelK(false)} title="حذف الملف؟">
      <p className="text-sm text-slate-600 dark:text-slate-300">سيتم حذف ملف <b>{k.name}</b> وجميع قراءاته نهائيًا ولا يمكن التراجع.</p>
      <div className="flex gap-2 mt-4"><button onClick={()=>setDelK(false)} className="flex-1 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 font-bold">إلغاء</button><button onClick={()=>{const rest=kids.filter(c=>c.id!==kid);if(rest.length){setKids(rest);setKid(rest[0].id)}setDelK(false)}} className="flex-1 py-3 rounded-2xl bg-rose-500 text-white font-bold">حذف</button></div>
    </Modal>

    <Modal open={addK} onClose={()=>setAddK(false)} title={ek?'تعديل بيانات الطفل':'إضافة طفل'}>
      <input value={nn} onChange={e=>setNn(e.target.value)} placeholder="الاسم" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent p-3 mb-2"/>
      <input value={na} onChange={e=>setNa(e.target.value)} placeholder="العمر (مثال: 5 سنوات)" className="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent p-3"/>
      <button disabled={!nn.trim()} onClick={()=>{if(ek){setKids(ks=>ks.map(c=>c.id===ek?{...c,name:nn.trim(),age:na.trim()||'—'}:c))}else{const id=Date.now();setKids([...kids,{id,name:nn.trim(),age:na.trim()||'—',r:[]}]);setKid(id)}setNn('');setNa('');setEk(null);setAddK(false)}} className="mt-4 w-full py-3 rounded-2xl bg-teal-500 text-white font-bold disabled:opacity-50">{ek?'حفظ التعديلات':'إضافة'}</button>
    </Modal>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
